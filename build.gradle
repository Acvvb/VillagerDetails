plugins {
    id 'idea'
}

subprojects { sp ->
    // 公共编译规范（Java 25 + 告警策略），loom/依赖由各版本子项目自己声明
    sp.plugins.withId('java') {
        sp.tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
            // 打开 javac 的全部告警，这样新出现的真实问题不会被默认设置吞掉。
            // -classfile：依赖 jar（guava/gson 等）里缺失批注类的噪音，不是我们的代码；
            // -processing：注解处理器相关的告警当前用不上。
            it.options.compilerArgs += ['-Xlint:all,-classfile,-processing']
            it.options.deprecation = true
        }
        sp.java {
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
        }
    }
}

// ============================================================
// 收集所有子版本的构建产物到根目录 lib/
//
// 用法：
//   ./gradlew collectJars        // 构建所有子版本 + 收集到 lib/
//   ./gradlew :v26.2:build       // 只构建 v26.2（产物仍在 v26.2/build/libs/，不进 lib/）
//
// 说明：
//   - 各子项目的标准产物目录仍然保留（v26.x/build/libs/），符合 Gradle 约定；
//   - lib/ 只是把最终 jar 复制一份过去，方便发布；
//   - 自动排除 sources / dev / javadoc 三个附属包。
// ============================================================
tasks.register('collectJars', Copy) {
    group = 'build'
    description = '构建所有子版本，并把各版本产出的 jar 收集到根目录 lib/'

    // 依赖所有「确实有 build 任务」的子项目
    dependsOn subprojects
            .findAll { it.tasks.named('build') != null }
            .collect { "${it.path}:build" }

    // 从每个子项目的 build/libs 目录收集
    subprojects.each { sp ->
        from(sp.layout.buildDirectory.dir('libs'))
    }

    include '*.jar'
    exclude '*-sources.jar', '*-dev.jar', '*-javadoc.jar'

    into layout.projectDirectory.dir('lib')
}

// 若根项目本身也有 build 任务，让它结束后自动触发 collectJars
// （你当前的根项目只有 idea 插件，没有 build 任务，所以这段暂时不会生效；
//  将来若给根项目加了 java/loom 插件，它会自动接力）
tasks.matching { it.name == 'build' }.configureEach {
    finalizedBy 'collectJars'
}