plugins {
    id 'idea'
}

subprojects { sp ->
    sp.plugins.withId('java') {
        def javaVersion = JavaVersion.toVersion(sp.property('java_version').toString())
        def javaRelease = sp.property('java_version').toString().toInteger()
        sp.tasks.withType(JavaCompile).configureEach {
            it.options.release = javaRelease
            it.options.compilerArgs += ['-Xlint:all,-classfile,-processing']
            it.options.deprecation = true
        }
        sp.java {
            sourceCompatibility = javaVersion
            targetCompatibility = javaVersion
        }
    }

    // ============================================================
    // 为每个有 client 源集的子模块注入「客户端 / 服务端」打包任务
    //
    // 客户端包：main + client，environment=client
    //   → 客户端正常加载；服务端看到 environment=client 直接跳过
    //
    // 服务端包：仅 main，environment=*
    //   → 客户端/服务端都能加载，但包里没有 client 类
    //   → Fabric Loader 按「入口点类型」和「mixin environment」自动跳过
    //     client 相关内容，不会 ClassNotFoundException
    //   → 体积明显小于客户端包
    // ============================================================
    sp.afterEvaluate {
        def sourceSets = sp.extensions.findByType(SourceSetContainer)
        if (sourceSets?.named('client') == null) return

        def baseName = sp.base.archivesName.get()
        def ver = sp.version

        // -------- 客户端专用包 --------
        sp.tasks.register('buildClientJar', Jar) {
            group = 'build'
            description = '构建客户端专用 JAR（main + client，environment=client）'
            archiveBaseName = baseName
            archiveVersion  = ver
            archiveClassifier = 'client'
            destinationDirectory = sp.layout.buildDirectory.dir('libs/client')

            from(sourceSets.main.output)
            from(sourceSets.client.output)
            from(sp.tasks.named('processResources')) {
                filesMatching('fabric.mod.json') {
                    filter { line ->
                        line.replaceAll(/"environment"\s*:\s*"[^"]*"/,
                                '"environment": "client"')
                    }
                }
            }
        }

        // -------- 服务端 / 通用包（仅 main）--------
        sp.tasks.register('buildServerJar', Jar) {
            group = 'build'
            description = '构建服务端 JAR（仅 main 源集，environment=*）'
            archiveBaseName = baseName
            archiveVersion  = ver
            archiveClassifier = 'server'
            destinationDirectory = sp.layout.buildDirectory.dir('libs/server')

            from(sourceSets.main.output)   // 只含 main，不含 client
            from(sp.tasks.named('processResources')) {
                filesMatching('fabric.mod.json') {
                    filter { line ->
                        line.replaceAll(/"environment"\s*:\s*"[^"]*"/,
                                '"environment": "*"')
                    }
                }
            }
        }
    }
}

// ============================================================
// 收集所有子版本的产物到根目录 lib/<模组版本>/<client|server>/
//
// 目录名取「模组版本」（sp.version 里 + 之前的部分，例如 1.0.0）。
// 各 MC 版本靠文件名区分，都堆在同一个 1.0.0/ 下面：
//
//   lib/
//     1.0.0/
//       client/
//         villagerdetails-1.0.0+fabric-0.19.3+26.2-client.jar
//         villagerdetails-1.0.0+fabric-0.19.3+26.3-client.jar
//       server/
//         villagerdetails-1.0.0+fabric-0.19.3+26.2-server.jar
//         villagerdetails-1.0.0+fabric-0.19.3+26.3-server.jar
//
// 用法：
//   ./gradlew build                    // 构建所有子版本 + 收集到 lib/
//   ./gradlew :v26.2:buildClientJar    // 只打 v26.2 客户端包
// ============================================================
def fabricLoaderTag = "+fabric-${property('loader_version').toString()}+"

tasks.register('collectJars', Copy) {
    group = 'build'
    description = '构建所有子版本，并按 <模组版本>/<client|server>/ 收集到根目录 lib/'

    dependsOn {
        subprojects.findAll { it.tasks.named('buildClientJar') != null }
                .collectMany { ["${it.path}:buildClientJar", "${it.path}:buildServerJar"] }
    }

    subprojects.each { sp ->
        def modVer = sp.version.toString().replaceFirst(/\+.*$/, '')  // 1.0.0+26.2 → 1.0.0
        from(sp.layout.buildDirectory.dir('libs/client')) { into "${modVer}/client" }
        from(sp.layout.buildDirectory.dir('libs/server')) { into "${modVer}/server" }
    }

    include '*.jar'
    exclude '*-sources.jar', '*-dev.jar', '*-javadoc.jar'

    eachFile { f ->
        if (f.name.endsWith('.jar') && f.name.contains('+')) {
            f.name = f.name.replaceFirst('\\+', fabricLoaderTag)
        }
    }

    into layout.projectDirectory.dir('lib')
}

tasks.register('build') {
    group = 'build'
    description = '构建所有子版本并收集产物到 lib/（等价于 collectJars）'
    dependsOn 'collectJars'
}