plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// villagerdetails-1.0.0+26.2
version = "${property('modVersion')}+${property('minecraft_version')}"
base {
    archivesName = rootProject.name
}

// ============================================================
// 三端分离的源集
//
//   main   ：两端契约（包定义 / 编解码 / 包类型注册 / 规则描述符 / 纯数据）
//   client ：物理客户端专属，由 loom.splitEnvironmentSourceSets() 创建
//   server ：全部服务端逻辑（指令 / 配置 / 规则实现 / 服务端收包 / Mixin / 入口点）
//
// 依赖方向：server → main。反方向（main → server）不允许，
// 否则 main 就编译不过（main 的 classpath 里没有 server）。
// 需要「main 触发、server 实现」时用 main 里的接口 + 事件 + 反射。
//
// 目录结构（common 里的代码会被各版本共用，版本目录里的同名文件覆盖 common）：
//   common/src/main/java   common/src/main/resources
//   common/src/client/java common/src/client/resources
//   common/src/server/java common/src/server/resources
//   src/main/java          src/main/resources
//   src/client/java        src/client/resources
//   src/server/java        src/server/resources
// ============================================================
sourceSets {
    server {
        java {
            srcDir file('../common/src/server/java')
            srcDir 'src/server/java'
        }
        resources {
            srcDir file('../common/src/server/resources')
            srcDir 'src/server/resources'
        }
    }
}

// Loom 的 splitEnvironmentSourceSets() 只会给 main / client 挂上 minecraft 依赖，
// 手动建的 server 源集默认拿不到任何 MC 类型。把 main 的 classpath 借过来：
//   - compileClasspath：编译期能看见 main 的类 + minecraft + loader + fabric-api
//   - runtimeClasspath：dev 的 runServer 跑得起来（和产出的 server 包同一套类）
// 不要写 server.compileClasspath += client.compileClasspath —— server 不能看见客户端类。
sourceSets.server.compileClasspath += sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
sourceSets.server.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

loom {
    splitEnvironmentSourceSets()

    mods {
        "villagerdetails" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            // 让 server 源集也进 dev 的 classpath group，否则 dev 里 server 的类
            // 不在「本模组」的加载组里，mixin 引用解析会出岔子
            sourceSet sourceSets.server
        }
    }

    runs {
        server {
            // dev 的服务端跑 server + main，和产出的 server 包一致；
            // 默认值是 main，那样 server 源集里的类在 dev 里根本不会被加载
            sourceSet.set('server')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// ===== 引入 common 源码（在本版本映射下编译），再叠加本版本专属源码 =====
sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')       // ← 改这里
            srcDir 'src/main/java'
        }
        resources {
            srcDir file('../common/src/main/resources')  // ← 改这里
            srcDir 'src/main/resources'
        }
    }
    client {
        java {
            srcDir file('../common/src/client/java')     // ← 改这里
            srcDir 'src/client/java'
        }
        resources {
            srcDir file('../common/src/client/resources') // ← 改这里
            srcDir 'src/client/resources'
        }
    }
}

processResources {
    def version = project.version
    def minecraftVersion = project.minecraft_version
    def loaderVersion = project.loader_version
    def fabricApiVersion = project.fabric_api_version
    def javaVersion = project.java_version
    inputs.property "version", version
    inputs.property "minecraft", minecraftVersion
    inputs.property "loaderVersion", loaderVersion
    inputs.property "fabricApiVersion", fabricApiVersion
    inputs.property "javaVersion", javaVersion

    // common 与版本目录的 srcDir 全都会进 main 资源；同名的版本文件最后引入，应覆盖 common。
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    filesMatching("fabric.mod.json") {
        expand "version": version, "minecraft": minecraftVersion, "loaderVersion": loaderVersion, "fabricApiVersion": fabricApiVersion, "javaVersion": javaVersion
    }
}

// client 资源同理（common 与版本目录的 srcDir 合并）
processClientResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// server 资源同理（common/src/server/resources 与 src/server/resources 合并）
processServerResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

// 只有 sourcesJar 需要「同名资源按顺序后者生效」：根 build.gradle 里的
// buildClientJar / buildServerJar 用的是 DuplicatesStrategy.FAIL（重名即构建失败），
// 所以这里不能一刀切给所有 Jar 任务设 INCLUDE。
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    def projectName = rootProject.name
    inputs.property "projectName", projectName

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from(rootProject.file("LICENSE")) {
        rename { "${it}_$projectName" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
