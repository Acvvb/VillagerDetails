name: build
"on": [ pull_request, push ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture client artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client
          path: lib/**/*-client.jar
          if-no-files-found: error

      - name: capture server artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server
          path: lib/**/*-server.jar
          if-no-files-found: error

      - name: capture all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all
          path: lib/**/*-all.jar
          if-no-files-found: error

      - name: capture sources artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sources
          path: lib/**/*-sources.jar
          if-no-files-found: error

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lib/**/*.jar
          body_path: changelogs/${{ github.ref_name }}.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-modrinth:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mc-version: ["26.2", "26.3"]
      max-parallel: 1
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: download all artifact
        uses: actions/download-artifact@v4
        with:
          name: all
          path: artifacts

      - name: download client artifact
        uses: actions/download-artifact@v4
        with:
          name: client
          path: artifacts

      - name: download server artifact
        uses: actions/download-artifact@v4
        with:
          name: server
          path: artifacts

      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ========== Modrinth ==========
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ========== CurseForge ==========
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: "VillagerDetails ${{ steps.extract_version.outputs.VERSION }} for MC ${{ matrix.mc-version }}"
          version: "${{ steps.extract_version.outputs.VERSION }}+${{ matrix.mc-version }}"
          version-type: release

          changelog-file: changelogs/${{ github.ref_name }}.md

          files: |
            artifacts/**/*+${{ matrix.mc-version }}-all.jar
            artifacts/**/*+${{ matrix.mc-version }}-client.jar
            artifacts/**/*+${{ matrix.mc-version }}-server.jar

          primary-file: artifacts/**/*+${{ matrix.mc-version }}-all.jar

          game-versions: |
            ${{ matrix.mc-version }}
          loaders: fabric
          environment: client, server