name: build
on: [ pull_request, push ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ★ 重要：拉取完整的 git 历史，用于自动生成 Release Notes

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # 走根项目 build → collectJars：每个子版本产出 client / server / all / sources 四件套，
      # 统一收进 lib/<模组版本>/，文件名形如：
      #   villagerdetails-<模组版本>+fabric-<loader>+api-<fabric-api>+minecraft-<MC>-<classifier>.jar
      - name: build
        run: ./gradlew build --no-daemon --console=plain --stacktrace

      # ★ 调试步骤：打印 lib 目录下的所有 jar，方便在日志里检查产物
      - name: Print lib folder
        run: find lib -type f -name '*.jar' | sort

      # 产物自检：四种 classifier 一个都不能少（collectJars 的过滤/重命名改坏时这里会直接失败）
      - name: verify artifacts
        run: |
          set -euo pipefail
          missing=0
          for suffix in client server all sources; do
            if ! find lib -type f -name "*-${suffix}.jar" | grep -q .; then
              echo "::error::missing *-${suffix}.jar in lib/"
              missing=1
            fi
          done
          echo "found $(find lib -type f -name '*.jar' | wc -l) jars"
          if [ "$missing" -ne 0 ]; then
            find lib -type f -name '*.jar' | sort
            exit 1
          fi

      # 平时 push / PR：上传客户端包（main + client，联机客户端用，体积最小）
      - name: capture client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client
          path: lib/**/*-client.jar
          if-no-files-found: error

      # 平时 push / PR：上传服务端包（main + server，专用服用）
      - name: capture server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: lib/**/*-server.jar
          if-no-files-found: error

      # 平时 push / PR：上传通用包（main + client + server，装哪端都能用）
      - name: capture all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all
          path: lib/**/*-all.jar
          if-no-files-found: error

      # 平时 push / PR：上传源码包
      - name: capture sources artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: lib/**/*-sources.jar
          if-no-files-found: error

      # 只有推送 tag 时才发布 Release：客户端 + 服务端 + 通用包 + 源码包 全传
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # ★ 四种产物按 glob 收，新增 classifier 时这里和上面的 upload 一起改
          files: |
            lib/**/*-client.jar
            lib/**/*-server.jar
            lib/**/*-all.jar
            lib/**/*-sources.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
